<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>Đảo Đèn Lồng</title><style>body{margin:0;background:#100d24;color:#ffe9b0;font:16px system-ui}canvas{display:block;margin:auto;background:linear-gradient(#17163d,#30234a);width:min(100vw,960px);height:min(75vh,640px)}#hud{max-width:960px;margin:10px auto;padding:10px;background:#251b42;border:1px solid #9b6fba;border-radius:8px}kbd{background:#51376a;padding:2px 5px;border-radius:4px}</style></head><body><canvas id="game" width="960" height="640"></canvas><div id="hud">Đảo Đèn Lồng · WASD di chuyển · <kbd>E</kbd> thắp đèn · <kbd>Space</kbd> tỏa sáng · <kbd>R</kbd> chơi lại<br><span id="status">Đang chuẩn bị…</span></div><script>
const c=document.getElementById('game'),x=c.getContext('2d'),s=document.getElementById('status');let p={x:480,z:320,flames:5,carry:0},keys={},lan=[];for(let i=0;i<5;i++){let a=-Math.PI/2+i*Math.PI*2/5;lan.push({x:480+Math.cos(a)*210,z:320+Math.sin(a)*210,lit:false,dep:0})}let motes=[[530,360],[420,400],[580,250],[380,270],[500,470],[620,360],[350,370]],sh=[[650,500]],score=0,over='';onkeydown=e=>{keys[e.key.toLowerCase()]=true;if(e.key===' '){e.preventDefault();p.flames=Math.max(0,p.flames-1)}if(e.key.toLowerCase()==='r')location.reload()};onkeyup=e=>keys[e.key.toLowerCase()]=false;function loop(){if(!over){let dx=(keys.d?1:0)-(keys.a?1:0),dz=(keys.s?1:0)-(keys.w?1:0),n=Math.hypot(dx,dz)||1;p.x+=dx/n*3;p.z+=dz/n*3;motes=motes.filter(m=>{if(Math.hypot(m[0]-p.x,m[1]-p.z)<20&&p.carry<5){p.carry++;score+=10;return false}return true});if(keys.e){let l=lan.find(l=>!l.lit&&Math.hypot(l.x-p.x,l.z-p.z)<35);if(l&&p.carry){let q=Math.min(p.carry,5-l.dep);l.dep+=q;p.carry-=q;if(l.dep===5){l.lit=true;score+=100}}}if(lan.every(l=>l.lit))over='THẮNG';if(p.flames<=0)over='THUA'}draw();requestAnimationFrame(loop)}function draw(){x.clearRect(0,0,960,640);x.fillStyle='#40375c';x.beginPath();x.arc(480,320,285,0,7);x.fill();lan.forEach(l=>{x.fillStyle=l.lit?'#ffc85a':'#542c70';x.beginPath();x.arc(l.x,l.z,18,0,7);x.fill();});motes.forEach(m=>{x.fillStyle='#fff2a1';x.beginPath();x.arc(m[0],m[1],5,0,7);x.fill()});sh.forEach(a=>{x.fillStyle='#351647';x.beginPath();x.arc(a[0],a[1],16,0,7);x.fill()});x.fillStyle='#ffcf70';x.beginPath();x.arc(p.x,p.z,14,0,7);x.fill();s.textContent=over?over+` · Điểm ${score} · Nhấn R để chơi lại`:`Đom đóm: ${p.carry}/5 · Lửa: ${p.flames} · Đèn: ${lan.filter(l=>l.lit).length}/5 · Điểm: ${score}`}loop();</script></body></html>
